[project]
name = "api-bronze"
version = "1.0.0"
description = "REST API -> raw record-grain Parquet bronze with dlt, for AWS Lambda"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned exactly: the envelope relies on RESTClient internals (response hooks,
    # response.json() call sites) and on dlt's incremental/arrow behaviour. Re-run
    # the test suite before any upgrade.
    "dlt[filesystem,parquet]==1.32.0",
]

[project.optional-dependencies]
# Secrets Manager refs (secrets.py). The Lambda base image ships boto3, but pin it.
aws = ["boto3>=1.40"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]
# Runs the silver reference transform test locally (needs Java 17+).
silver = ["pyspark==4.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_bronze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: needs pyspark 4.1 and Java (uv sync --group silver)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # deliberate non-ASCII in docs and test data
